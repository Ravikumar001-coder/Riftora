spring.application.name=gameverse-backend
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/etms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=826001
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JSON Mapping (Align with Frontend snake_case expectations)
spring.jackson.property-naming-strategy=SNAKE_CASE



# Google OAuth Configuration
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET

# Secure Room Credential Management (Module 8)
# A robust 32-byte Base64 encoded key (256 bits). DO NOT check real prod keys into version control.
# In a real environment, this comes from AWS Secrets Manager / Vault at runtime.
gameverse.security.credentials.encryption-key=VGhpc0lzQVNlY3JldEtleUZvckFFUzI1NkVuY3J5cHQ=
gameverse.security.credentials.key-reference=kms-key-v1
